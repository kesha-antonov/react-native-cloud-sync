name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      # `prepare` runs `bob build`, so a successful install also proves the
      # package builds.
      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test

      # Catches podspec bugs on a Linux runner, without waiting for a macOS
      # job. `ruby -c` only parses - it accepted a podspec that raised the
      # moment CocoaPods evaluated it, which broke every iOS build.
      - name: Validate the podspec
        run: |
          sudo gem install cocoapods-core --no-document --quiet
          yarn validate:podspec

  ios:
    name: iOS build (New Architecture)
    # macos-26 for Xcode 26: Expo SDK 57 pulls Swift Package Manager
    # dependencies declared with Swift tools 6.2, which the macos-15 image's
    # Swift 6.1 refuses to resolve.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      # example/ios is generated, not committed, so it has to be produced here.

      # app.plugin.js points at plugin/build/, which is generated and
      # gitignored. `expo prebuild` loads the config plugin, so this must
      # exist first or prebuild dies resolving it.

      # Cheap pre-flight: confirms every Swift member the Objective-C++
      # bridge calls is actually exposed to Objective-C, before spending
      # minutes on pod install and a full build.
      - name: Check the Objective-C surface
        run: yarn check:objc
      - name: Build the config plugin
        run: yarn build-plugin
      - name: Prebuild the example
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: example/ios
        env:
          RCT_NEW_ARCH_ENABLED: '1'
        run: pod install

      # The first thing that actually compiles ios/RNCloudSync.mm and the
      # Swift implementation behind it. Everything else in this workflow is
      # JavaScript.
      - name: Build
        working-directory: example/ios
        run: |
          set -euo pipefail
          # Discover the generated names rather than hardcoding them - the
          # workspace is produced by `expo prebuild` from app.json.
          WORKSPACE=$(ls -d ./*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

  ios-static-frameworks:
    name: iOS static frameworks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable


      # app.plugin.js points at plugin/build/, which is generated and
      # gitignored. `expo prebuild` loads the config plugin, so this must
      # exist first or prebuild dies resolving it.

      # Cheap pre-flight: confirms every Swift member the Objective-C++
      # bridge calls is actually exposed to Objective-C, before spending
      # minutes on pod install and a full build.
      - name: Check the Objective-C surface
        run: yarn check:objc
      - name: Build the config plugin
        run: yarn build-plugin
      - name: Prebuild the example
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      # Static linkage changes how the Swift module is emitted and is a common
      # way for a pod mixing Swift and Objective-C++ to break. Consuming apps
      # otherwise carry hand-written Podfile repairs for pods that get it wrong.
      - name: Install pods with static frameworks
        working-directory: example/ios
        env:
          RCT_NEW_ARCH_ENABLED: '1'
          USE_FRAMEWORKS: static
        run: pod install

      - name: Build
        working-directory: example/ios
        run: |
          set -euo pipefail
          # Discover the generated names rather than hardcoding them - the
          # workspace is produced by `expo prebuild` from app.json.
          WORKSPACE=$(ls -d ./*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build
