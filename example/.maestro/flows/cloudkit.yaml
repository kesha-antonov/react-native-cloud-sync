    direction: DOWN
- assertVisible: ".*· getAllKeys.*"

- scrollUntilVisible:
    element:
      id: "cloudkit-btn-oversized"
    direction: UP
    centerElement: true
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "cloudkit-btn-oversized"
- scrollUntilVisible:
    element:
      id: "cloudkit-btn-clear"
    direction: DOWN
- assertVisible: ".*ERR_PAYLOAD_TOO_LARGE.*"

- scrollUntilVisible:
    element:
      id: "cloudkit-btn-zoneCreate"
    direction: UP
    centerElement: true
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    id: "cloudkit-btn-zoneCreate"
- scrollUntilVisible:
    element:
      id: "cloudkit-btn-clear"
    direction: DOWN
- assertVisible: '.*· zones\.create.*'

- scrollUntilVisible:
