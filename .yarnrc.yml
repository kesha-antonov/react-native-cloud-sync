# React Native tooling (Metro, the Expo CLI, ESLint's config loader) expects a
# real node_modules tree. Yarn defaults to Plug'n'Play, so pin the linker here
# rather than relying on a machine-level ~/.yarnrc.yml.
nodeLinker: node-modules

# Needed for install-time scripts: React Native packages rely on postinstall,
# and this package's own `prepare` hook runs `bob build`.
enableScripts: true

# Keep the cache inside the project, as .gitignore already assumes.
enableGlobalCache: false
compressionLevel: mixed
